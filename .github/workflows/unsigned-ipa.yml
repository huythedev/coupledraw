name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test server
        run: python3 -m unittest discover -s server -v -f

      - name: Test iOS models
        shell: bash
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone")))')
          xcodebuild test -project CoupleDraw.xcodeproj -scheme CoupleDraw \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath build/test-derived-data CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned IPA
        run: sh tools/build-unsigned-ipa-on-mac.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          path: dist/CoupleDraw-unsigned.ipa
          archive: false
          if-no-files-found: error

      - name: Publish unsigned IPA to GitHub Releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          ipa=dist/CoupleDraw-unsigned.ipa
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="build-${GITHUB_RUN_NUMBER}"
          fi

          # Re-running a successful build replaces that run's asset.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ipa" --clobber
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$tag" "$ipa" --verify-tag --generate-notes
          else
            gh release create "$tag" "$ipa" --target "$GITHUB_SHA" \
              --title "CoupleDraw unsigned build #${GITHUB_RUN_NUMBER}" \
              --notes "Unsigned IPA from commit ${GITHUB_SHA}. Sign the app and embedded widget before installing on an iPhone."
          fi
